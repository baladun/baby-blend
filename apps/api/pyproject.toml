[project]
name = "babyblend-api"
version = "0.1.0"
description = "BabyBlend backend — FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "T20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
